name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag and prepare release notes
        run: |
          mkdir -p dist
          python3 scripts/release.py check "$GITHUB_REF_NAME" > dist/release-notes.md
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Test and vet Go packages
        run: |
          nix develop --command make test-all
          nix develop --command go vet -tags migrated_fynedo ./...
      - name: Build and package Windows x64
        run: |
          make build-windows
          nix develop --command python3 scripts/release.py package amd64
      - name: Build and package Windows ARM64
        run: |
          make build-windows-arm64
          nix develop --command python3 scripts/release.py package arm64
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          files=(
            "dist/nmf-${GITHUB_REF_NAME}-windows-amd64.zip"
            "dist/nmf-${GITHUB_REF_NAME}-windows-amd64.zip.sha256"
            "dist/nmf-${GITHUB_REF_NAME}-windows-arm64.zip"
            "dist/nmf-${GITHUB_REF_NAME}-windows-arm64.zip.sha256"
          )
          for file in "${files[@]}"; do test -s "$file"; done
          (cd dist && sha256sum --check ./*.zip.sha256)
          options=()
          if [[ "${version%%+*}" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            "${options[@]}" "${files[@]}"
