name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Fyne build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Test GUI smoke runner
        run: node --test scripts/gui-windows/runner.test.mjs
      - run: go vet -tags migrated_fynedo ./...
      - run: go test -race -tags migrated_fynedo ./...

  windows-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - name: Check Nix flake
        run: nix flake check
      - name: Compile Windows amd64 tests
        run: make test-windows-compile
      - name: Compile Windows arm64 tests
        run: make test-windows-compile-arm64

  windows-native:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      # Match dev-windows.ps1 so setup-go caches the directory actually used.
      GOCACHE: ${{ github.workspace }}\.cache\go-build-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Zig 0.16.0
        # Same Zig release as the current flake.lock; verify the official archive.
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.16.0.zip'
          Invoke-WebRequest 'https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip' -OutFile $archive
          $expected = '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'Zig archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.16.0' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Show native toolchain versions
        run: |
          go version
          zig version
      - name: Run all native Windows tests
        run: ./scripts/dev-windows.ps1 test -Arguments @('-v', './...')
      - name: Vet native Windows packages
        run: ./scripts/dev-windows.ps1 vet
      - name: Build native Windows development executable
        run: ./scripts/dev-windows.ps1 build

  macos-smoke:
    # macOS is not a supported release target yet. Keep this diagnostic until
    # the native suite and manual GUI checks have been proven stable.
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run native macOS smoke tests
        env:
          CGO_ENABLED: "1"
        run: go test -tags migrated_fynedo ./...
